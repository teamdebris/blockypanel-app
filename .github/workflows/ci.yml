name: CI

on:
  push:
    # main is the stable line (latest); dev collects merged pull requests for testing (dev).
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
  # Run by hand from the Actions tab: builds and pushes the image under its commit (sha-...) tag only;
  # dev and latest stay tied to their branches.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      # A current restic for the offsite integration test (Ubuntu's package is older than the image's).
      # Checked against the release's SHA256SUMS, so a tampered download can't run in CI.
      - run: |
          curl -fsSL -o restic.bz2 https://github.com/restic/restic/releases/download/v0.19.1/restic_0.19.1_linux_amd64.bz2
          echo "f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c  restic.bz2" | sha256sum -c -
          bunzip2 -c restic.bz2 | sudo tee /usr/local/bin/restic > /dev/null
          sudo chmod +x /usr/local/bin/restic
          rm restic.bz2
          restic version
      # The Compose files people download must parse, alone and with the Caddy overlay.
      - run: |
          export BLOCKY_ADMIN_PASSWORD=ci-placeholder-password-0000 BLOCKY_DOMAIN=panel.example.com
          docker compose -f compose.yaml config -q
          docker compose -f compose.yaml -f compose.caddy.yaml config -q
          docker compose -f compose.demo.yaml config -q
          # The SFTP port follows BLOCKY_BIND_ADDRESS unless BLOCKY_SFTP_BIND_ADDRESS is set.
          sftp_host() { docker compose -f compose.yaml config --format json | jq -r '.services.blocky.ports[] | select(.target == 2022) | .host_ip'; }
          test "$(sftp_host)" = "0.0.0.0"
          test "$(BLOCKY_BIND_ADDRESS=127.0.0.1 sftp_host)" = "127.0.0.1"
          test "$(BLOCKY_BIND_ADDRESS=127.0.0.1 BLOCKY_SFTP_BIND_ADDRESS=0.0.0.0 sftp_host)" = "0.0.0.0"
      - run: npm ci
      # Known high or critical advisories in what ships fail the build (developer-only tools don't).
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build   # includes the type check

  # Each architecture builds on its own native runner (no emulation), pushed by digest; `publish`
  # then joins them under the tags. arm64 used to build under QEMU, which took most of the time.
  image:
    needs: check
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Labels only (they link the package to this repository); tags are applied in publish.
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BLOCKY_BUILD=${{ github.sha }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
      - run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # latest is the main branch, not the default branch (dev is the default, for vetting).
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      # One multi-architecture tag from the two digests; both must exist or nothing is tagged.
      - working-directory: ${{ runner.temp }}/digests
        run: |
          test "$(ls | wc -l)" -eq 2
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "ghcr.io/$REPOSITORY@sha256:%s " *)
        env:
          REPOSITORY: ${{ github.repository }}
      - run: docker buildx imagetools inspect "ghcr.io/$REPOSITORY:$VERSION"
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ steps.meta.outputs.version }}
