# Optional: HTTPS in front of the panel with Caddy, which gets and renews certificates by itself.
#
# 1. Point a domain (e.g. panel.example.com) at this machine and open ports 80 and 443.
# 2. In .env, set:
#      COMPOSE_FILE=compose.yaml:compose.caddy.yaml
#      BLOCKY_DOMAIN=panel.example.com
# 3. docker compose up -d
#
# Skip this if the machine already runs a reverse proxy (Nginx Proxy Manager, Traefik, Caddy):
# point that at 127.0.0.1:3000 instead (see the README).
services:
  blocky:
    environment:
      # Caddy is the only way in (the panel's own port stays on 127.0.0.1), so its forwarded
      # headers can be trusted, and every visit is over HTTPS.
      BLOCKY_TRUST_PROXY: "true"
      BLOCKY_COOKIE_SECURE: "true"

  caddy:
    image: caddy:2
    container_name: blocky-caddy
    command: caddy reverse-proxy --from ${BLOCKY_DOMAIN:?Set BLOCKY_DOMAIN in .env} --to blocky:3000
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # Certificates, kept with the rest of the install.
      - ${BLOCKY_HOST_STORAGE:-/opt/blocky-panel}/caddy:/data
    depends_on:
      - blocky
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE # ports 80 and 443
